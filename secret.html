<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷涩调的私人空间</title>
    <style>
        :root {
            --text-main: #7a8f93;
            --text-strong: #8aa8ac;
            --accent: 60, 110, 120;
            --accent-warm: 80, 130, 140;
            --deep-red: #8b1a1a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, #0a1214 0%, #060a0b 50%, #000000 100%);
            color: var(--text-main);
            line-height: 1.8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .back {
            position: fixed;
            top: 16px;
            left: 16px;
            font-size: 0.75rem;
            color: rgba(var(--accent-warm), 0.4);
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.3s ease;
            z-index: 10;
        }
        .back:hover { color: rgba(var(--accent-warm), 0.7); }

        .login-card {
            width: 100%;
            max-width: 360px;
            padding: 40px 32px 32px 32px;
            background: rgba(30, 70, 80, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(var(--accent), 0.10);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 14px;
            opacity: 0.9;
        }

        .login-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-strong);
            letter-spacing: 4px;
            margin-bottom: 28px;
            opacity: 0.9;
        }

        .login-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 18, 20, 0.4);
            border: 1px solid rgba(var(--accent), 0.15);
            border-radius: 12px;
            color: var(--text-strong);
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }
        .login-input::placeholder {
            color: rgba(var(--accent-warm), 0.25);
            letter-spacing: 1px;
        }
        .login-input:focus {
            border-color: rgba(var(--accent), 0.4);
            background: rgba(10, 18, 20, 0.6);
            box-shadow: 0 0 0 3px rgba(var(--accent), 0.08);
        }

        .login-hint {
            margin-top: 10px;
            font-size: 0.7rem;
            color: rgba(var(--accent-warm), 0.3);
            letter-spacing: 1px;
            font-weight: 300;
        }

        .login-btn {
            margin-top: 18px;
            width: 100%;
            padding: 12px 0;
            background: rgba(var(--accent), 0.10);
            border: 1px solid rgba(var(--accent), 0.20);
            border-radius: 12px;
            color: var(--text-strong);
            font-size: 0.9rem;
            letter-spacing: 6px;
            cursor: pointer;
            font-weight: 400;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .login-btn:hover {
            background: rgba(var(--accent), 0.18);
            border-color: rgba(var(--accent), 0.30);
        }
        .login-btn:active {
            transform: scale(0.98);
        }

        .login-error {
            margin-top: 14px;
            font-size: 0.78rem;
            color: var(--deep-red);
            letter-spacing: 1px;
            min-height: 1.2em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .login-error.show {
            opacity: 1;
        }

        .welcome {
            display: none;
            width: 100%;
            max-width: 520px;
            padding: 32px 28px;
            background: rgba(30, 70, 80, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(var(--accent), 0.10);
            border-left: 2px solid var(--deep-red);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: left;
            font-size: 0.95rem;
            color: var(--text-main);
            letter-spacing: 0.5px;
            animation: fadeIn 0.8s ease;
        }
        .welcome.show { display: block; }
        .welcome p { margin-bottom: 14px; }
        .welcome p:last-child { margin-bottom: 0; }
        .welcome .placeholder {
            color: rgba(139, 26, 26, 0.75);
            font-weight: 700;
            letter-spacing: 2px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>
    <a class="back" href="index.html">← 返回主页</a>

    <div class="login-card" id="loginCard">
        <span class="login-emoji">🐰</span>
        <div class="login-title">冷涩调的私人空间</div>

        <input
            class="login-input"
            id="loginInput"
            type="password"
            inputmode="numeric"
            placeholder="请输入密码"
            autocomplete="off"
        >
        <div class="login-hint">哪天对我最重要呢</div>

        <button class="login-btn" id="loginBtn">进入</button>

        <div class="login-error" id="loginError">不对哦 再想想好不好</div>
    </div>

    <div class="welcome" id="welcomeBox">
        <p>欢迎回家。</p>
        <p class="placeholder">……（后面我想想）</p>
    </div>

    <script>
        const PASSWORD = '20220625';

        const input = document.getElementById('loginInput');
        const btn = document.getElementById('loginBtn');
        const errorEl = document.getElementById('loginError');
        const loginCard = document.getElementById('loginCard');
        const welcomeBox = document.getElementById('welcomeBox');

        function tryLogin() {
            const value = input.value.trim();
            if (value === PASSWORD) {
                errorEl.classList.remove('show');
                loginCard.style.display = 'none';
                welcomeBox.classList.add('show');
            } else {
                errorEl.classList.add('show');
                loginCard.style.animation = 'none';
                void loginCard.offsetWidth;
                loginCard.style.animation = 'shake 0.35s ease';
            }
        }

        btn.addEventListener('click', tryLogin);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') tryLogin();
        });
    </script>
</body>
</html>
