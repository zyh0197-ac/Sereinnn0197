<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密档案</title>
    <style>
        :root {
            --text-main: #7a8f93;
            --text-strong: #8aa8ac;
            --accent: 60, 110, 120;
            --accent-warm: 80, 130, 140;
            --deep-red: #8b1a1a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, #0a1214 0%, #060a0b 50%, #000000 100%);
            color: var(--text-main);
            line-height: 1.8;
            padding: 40px 20px;
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .back {
            position: fixed;
            top: 16px;
            left: 16px;
            font-size: 0.75rem;
            color: rgba(var(--accent-warm), 0.4);
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.3s ease;
            z-index: 10;
        }
        .back:hover { color: rgba(var(--accent-warm), 0.7); }
        .secret-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-strong);
            letter-spacing: 6px;
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.85;
        }
        .secret-body {
            padding: 24px 26px;
            background: rgba(30, 70, 80, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(var(--accent), 0.08);
            border-left: 2px solid var(--deep-red);
            font-size: 0.95rem;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        .secret-body p { margin-bottom: 12px; }
        .secret-body p:last-child { margin-bottom: 0; }
        .placeholder {
            color: rgba(139, 26, 26, 0.7);
            font-weight: 700;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <a class="back" href="index.html">← 返回主页</a>

    <div class="secret-title">秘 密 档 案</div>

    <div class="secret-body">
        <p>你找到了这里。</p>
        <p>但故事还没写完。</p>
        <p class="placeholder">……（内容待定，等你想好了填进来）</p>
    </div>
</body>
</html>
