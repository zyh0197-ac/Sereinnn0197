<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷涩调老傻坤</title>
    <style>
        :root {
            --text-main: #7a8f93;
            --text-strong: #8aa8ac;
            --accent: 60, 110, 120;
            --accent-warm: 80, 130, 140;
            --gold: #c8a85a;
            --bg-card: rgba(30, 70, 80, 0.02);
            --bg-card-hover: rgba(60, 110, 120, 0.08);
            --border-soft: rgba(60, 110, 120, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body,
        .content,
        .line,
        .theme-toggle,
        .game-card,
        .friend-list .tag,
        .toast-box,
        .toast-box .btn-close,
        .avatar,
        .progress-corner,
        .weather-corner {
            transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, #0a1214 0%, #060a0b 50%, #000000 100%);
            color: var(--text-main);
            line-height: 1.7;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            font-weight: 400;
            position: relative;
            opacity: 0;
            animation: fadeInPage 1.5s ease forwards;
        }

        @keyframes fadeInPage {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        body.light-mode {
            --text-main: #5a6f73;
            --text-strong: #4a6a6f;
            --accent: 160, 180, 180;
            --accent-warm: 100, 130, 140;
            --bg-card: rgba(255, 255, 255, 0.15);
            --bg-card-hover: rgba(255, 255, 255, 0.25);
            --border-soft: rgba(160, 180, 180, 0.10);
            background: radial-gradient(ellipse at 50% 0%, #f0f0ed 0%, #e6e6e3 50%, #d9d9d6 100%);
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.008) 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, rgba(255,255,255,0.006) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,0.005) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(255,255,255,0.007) 1px, transparent 1px);
            background-size: 200px 200px, 150px 150px, 180px 180px, 220px 220px;
        }

        body.light-mode::after {
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, rgba(0,0,0,0.010) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(0,0,0,0.008) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(0,0,0,0.012) 1px, transparent 1px);
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 70% 20%, rgba(40, 90, 100, 0.03) 0%, transparent 50%),
                        radial-gradient(ellipse at 30% 80%, rgba(30, 70, 80, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        body.light-mode::before {
            background: radial-gradient(ellipse at 70% 20%, rgba(200, 180, 160, 0.03) 0%, transparent 50%),
                        radial-gradient(ellipse at 30% 80%, rgba(180, 160, 140, 0.02) 0%, transparent 50%);
        }

        .header, .content, .footer {
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(var(--accent), 0.08);
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a5a62, #1a3a42, #2a5a62);
            background-size: 300% 300%;
            animation: glowSpin 6s ease-in-out infinite;
            z-index: -1;
            filter: blur(12px);
            opacity: 0.10;
        }

        @keyframes glowSpin {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(var(--accent), 0.15);
            display: block;
            margin: 0 auto;
            position: relative;
            background: #060a0b;
        }

        .name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-strong);
            letter-spacing: 6px;
            opacity: 0.85;
        }

        /* ===== 右上角切换按钮 ===== */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(var(--accent), 0.08);
            background: rgba(10, 18, 20, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--gold);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: rgba(200, 180, 100, 0.15);
            background: rgba(10, 18, 20, 0.5);
            box-shadow: 0 0 20px rgba(200, 180, 80, 0.06);
        }

        .theme-toggle:active {
            transform: scale(0.92);
        }

        body.light-mode .theme-toggle {
            background: rgba(255, 255, 255, 0.25);
        }

        body.light-mode .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(200, 180, 100, 0.15);
            box-shadow: 0 0 24px rgba(200, 180, 80, 0.08);
        }

        /* ===== 左上角进度条 ===== */
        .progress-corner {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 18, 20, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(var(--accent), 0.06);
            border-radius: 30px;
            padding: 6px 14px 6px 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            user-select: none;
            pointer-events: none;
        }

        body.light-mode .progress-corner {
            background: rgba(255, 255, 255, 0.4);
        }

        .progress-corner .label {
            font-size: 0.6rem;
            color: rgba(var(--accent-warm), 0.25);
            letter-spacing: 1px;
            font-weight: 300;
            white-space: nowrap;
        }

        .progress-corner .bar-wrap {
            width: 60px;
            height: 3px;
            background: rgba(var(--accent), 0.10);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-corner .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: linear-gradient(90deg, rgba(var(--accent), 0.20), rgba(100, 170, 180, 0.30));
            transition: width 0.8s ease;
        }

        body.light-mode .progress-corner .bar-fill {
            background: linear-gradient(90deg, rgba(180, 150, 80, 0.3), rgba(200, 170, 100, 0.4));
        }

        .progress-corner .pct {
            font-size: 0.65rem;
            color: rgba(var(--accent-warm), 0.30);
            font-weight: 300;
            min-width: 32px;
            text-align: right;
            letter-spacing: 0.5px;
        }

        /* ===== 右下角天气 ===== */
        .weather-corner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(10, 18, 20, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(var(--accent), 0.06);
            border-radius: 30px;
            padding: 6px 16px 6px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(var(--accent-warm), 0.35);
            letter-spacing: 0.5px;
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
        }

        body.light-mode .weather-corner {
            background: rgba(255, 255, 255, 0.3);
        }

        .weather-corner .w-icon {
            font-size: 0.9rem;
            line-height: 1;
        }

        .weather-corner .w-temp {
            font-weight: 300;
            color: rgba(var(--accent-warm), 0.30);
        }

        .weather-corner .w-city {
            font-size: 0.55rem;
            color: rgba(var(--accent-warm), 0.15);
            max-width: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 600px) {
            .theme-toggle {
                top: 12px;
                right: 12px;
                width: 30px;
                height: 30px;
                font-size: 0.75rem;
            }
            .progress-corner {
                top: 12px;
                left: 12px;
                padding: 5px 10px 5px 10px;
                gap: 6px;
            }
            .progress-corner .bar-wrap {
                width: 40px;
            }
            .progress-corner .label {
                font-size: 0.5rem;
            }
            .progress-corner .pct {
                font-size: 0.55rem;
                min-width: 26px;
            }
            .weather-corner {
                bottom: 14px;
                right: 14px;
                padding: 4px 12px 4px 10px;
                font-size: 0.65rem;
                gap: 5px;
            }
            .weather-corner .w-icon {
                font-size: 0.75rem;
            }
            .weather-corner .w-city {
                max-width: 30px;
            }
        }

        @media (max-width: 400px) {
            .theme-toggle {
                top: 10px;
                right: 10px;
                width: 26px;
                height: 26px;
                font-size: 0.65rem;
            }
            .progress-corner .bar-wrap {
                width: 30px;
            }
            .progress-corner .pct {
                font-size: 0.5rem;
                min-width: 22px;
            }
            .weather-corner {
                font-size: 0.55rem;
                padding: 3px 10px 3px 8px;
            }
            .weather-corner .w-icon {
                font-size: 0.65rem;
            }
        }

        .content {
            margin-bottom: 25px;
            padding: 20px 24px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-soft);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .line {
            margin-bottom: 14px;
            font-size: 0.98rem;
            padding: 4px 0;
            border-bottom: 1px solid rgba(var(--accent), 0.04);
            color: var(--text-main);
        }

        .line::before {
            content: '◆';
            color: rgba(var(--accent), 0.15);
            font-size: 0.5rem;
            margin-right: 8px;
        }

        .friends-section {
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: 12px;
            border-left: 2px solid rgba(var(--accent), 0.10);
        }

        .friends-title {
            font-size: 0.7rem;
            margin-bottom: 8px;
            color: rgba(var(--accent-warm), 0.35);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .friend-list {
            font-size: 1rem;
            line-height: 2.2;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .bold-deep {
            font-weight: 700;
            color: var(--text-strong);
        }

        .friend-list .tag {
            display: inline-block;
            background: rgba(var(--accent), 0.05);
            padding: 2px 14px;
            border-radius: 20px;
            margin: 2px 6px 2px 0;
            font-size: 0.9rem;
            border: 1px solid rgba(var(--accent), 0.05);
            color: var(--text-main);
        }

        .friend-list .tag:hover {
            background: rgba(var(--accent), 0.08);
            border-color: rgba(var(--accent), 0.08);
            transform: translateY(-1px);
            color: var(--text-strong);
        }

        .diary-days-row {
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(var(--accent), 0.05);
        }

        .diary-days {
            font-size: 0.8rem;
            color: rgba(var(--accent-warm), 0.35);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .diary-days strong {
            color: rgba(var(--accent-warm), 0.50);
            font-weight: 500;
        }

        .game-card {
            margin: 14px 0 6px 0;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-soft);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            text-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .game-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(var(--accent), 0.12);
            transform: scale(1.01);
        }

        .game-card:active {
            transform: scale(0.97);
            background: rgba(var(--accent), 0.04);
        }

        .game-card .icon {
            font-size: 1.3rem;
            margin-right: 6px;
        }

        .game-card .label {
            font-size: 0.95rem;
            color: var(--text-main);
            letter-spacing: 1.5px;
            font-weight: 300;
        }

        .game-card .sub {
            font-size: 0.6rem;
            color: rgba(var(--accent-warm), 0.15);
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
        }

        .toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .toast-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .toast-box {
            background: rgba(10, 18, 20, 0.95);
            border: 1px solid rgba(var(--accent), 0.15);
            border-radius: 24px;
            padding: 32px 36px 28px 36px;
            max-width: 340px;
            width: 85%;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
            animation: scaleIn 0.3s ease;
        }

        body.light-mode .toast-box {
            background: rgba(240, 240, 237, 0.95);
        }

        .toast-box .emoji {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 12px;
        }

        .toast-box .title {
            font-size: 1.1rem;
            color: var(--text-strong);
            letter-spacing: 1px;
            font-weight: 400;
            margin-bottom: 6px;
        }

        .toast-box .msg {
            font-size: 0.85rem;
            color: rgba(var(--accent-warm), 0.4);
            letter-spacing: 0.5px;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .toast-box .btn-close {
            background: rgba(var(--accent), 0.08);
            border: 1px solid rgba(var(--accent), 0.10);
            border-radius: 12px;
            padding: 10px 32px;
            color: var(--text-main);
            font-size: 0.9rem;
            letter-spacing: 2px;
            cursor: pointer;
            font-weight: 300;
        }

        .toast-box .btn-close:hover {
            background: rgba(var(--accent), 0.12);
            border-color: rgba(var(--accent), 0.15);
            color: var(--text-strong);
        }

        .visitor-count {
            margin-top: 10px;
            padding: 10px 0 4px 0;
            font-size: 0.65rem;
            color: rgba(var(--accent-warm), 0.18);
            text-align: center;
            letter-spacing: 1.5px;
            border-top: 1px solid rgba(var(--accent), 0.04);
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .avatar {
                width: 100px;
                height: 100px;
            }
            .name {
                font-size: 1.5rem;
                letter-spacing: 4px;
            }
            .content {
                padding: 16px;
            }
            .line {
                font-size: 0.9rem;
            }
            .friend-list .tag {
                font-size: 0.8rem;
                padding: 1px 10px;
            }
            .diary-days {
                font-size: 0.7rem;
            }
            .game-card .label {
                font-size: 0.85rem;
            }
            .toast-box {
                padding: 28px 24px 24px 24px;
            }
            .toast-box .emoji {
                font-size: 2.4rem;
            }
        }

        @media (max-width: 400px) {
            .name {
                letter-spacing: 3px;
            }
            .game-card {
                padding: 14px 14px;
            }
            .game-card .label {
                font-size: 0.8rem;
            }
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(var(--accent), 0.05);
            font-size: 0.75rem;
            color: rgba(var(--accent-warm), 0.12);
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

            <button class="btn-close" id="toastCloseBtn">知道了</button>
        </div>

    <script>
        // ===== 安全读写 localStorage =====
        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
        }

        // ===== 头像容错（只用 JS 一处，去掉内联） =====
        document.querySelectorAll('.avatar').forEach(img => {
            img.onerror = function () {
                this.style.display = 'none';
            };
        });

        // ===== 天数 =====
        const ANNIVERSARY = new Date(2022, 5, 25); // 2022-06-25
        function updateDiaryDays() {
            const now = new Date();
            const start = new Date(ANNIVERSARY.getFullYear(), ANNIVERSARY.getMonth(), ANNIVERSARY.getDate());
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const diffDays = Math.floor((today - start) / 86400000);
            const days = diffDays >= 0 ? diffDays : 0;
            const el = document.getElementById('diaryDaysDisplay');
            if (el) {
                el.innerHTML = `💙 和伊索卡尔已经 <strong>${days}</strong> 天`;
            }
        }
        updateDiaryDays();

        // ===== 访客计数（首次 +1，之后每次 +1） =====
        (function initVisitor() {
            const el = document.getElementById('visitorDisplay');
            if (!el) return;
            let count = parseInt(safeGet('visitorCount'), 10);
            if (isNaN(count)) count = 3748;
            count += 1;
            safeSet('visitorCount', String(count));
            el.textContent = `✦ 已有 ${count.toLocaleString()} 人看过我`;
        })();

        // ===== 进度条 =====
        function updateProgress() {
            const now = new Date();
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
            const elapsed = now - startOfDay;
            const total = endOfDay - startOfDay;
            const pct = Math.min(100, (elapsed / total) * 100);
            const fill = document.getElementById('progressFill');
            const pctText = document.getElementById('progressPct');
            if (fill) fill.style.width = pct + '%';
            if (pctText) pctText.textContent = Math.round(pct) + '%';
        }
        updateProgress();
        setInterval(updateProgress, 60000);

        // ===== 天气 =====
        const WEATHER_ICON_MAP = {
            '113': '☀️', '116': '🌤', '119': '⛅', '122': '☁️',
            '143': '🌫', '176': '🌦', '179': '🌨', '182': '🌧',
            '185': '🌧', '200': '⛈', '227': '❄️', '230': '❄️',
            '248': '🌫', '260': '🌫', '263': '🌦', '266': '🌧',
            '281': '🌧', '284': '🌧', '293': '🌦', '296': '🌧',
            '299': '🌧', '302': '🌧', '305': '🌧', '308': '🌧',
            '311': '🌧', '314': '🌧', '317': '🌧', '320': '🌨',
            '323': '🌨', '326': '🌨', '329': '🌨', '332': '❄️',
            '335': '❄️', '338': '❄️', '350': '🌧', '353': '🌦',
            '356': '🌧', '359': '🌧', '362': '🌧', '365': '🌧',
            '368': '🌨', '371': '🌨', '374': '🌧', '377': '🌧',
            '386': '⛈', '389': '⛈', '392': '🌨', '395': '❄️'
        };

        function setWeatherUnavailable() {
            document.getElementById('weatherIcon').textContent = '🌤';
            document.getElementById('weatherTemp').textContent = '--°';
            document.getElementById('weatherCity').textContent = '--';
        }

        function getWeather() {
            fetch('https://wttr.in?format=j1&lang=zh')
                .then(res => {
                    if (!res.ok) throw new Error('Weather API error');
                    return res.json();
                })
                .then(data => {
                    const current = data?.current_condition?.[0];
                    if (!current) throw new Error('No current condition');
                    const temp = current.temp_C;
                    const code = current.weatherCode;
                    const city = data?.nearest_area?.[0]?.areaName?.[0]?.value || '--';
                    const icon = WEATHER_ICON_MAP[code] || '🌤';

                    document.getElementById('weatherIcon').textContent = icon;
                    document.getElementById('weatherTemp').textContent = temp + '°';
                    document.getElementById('weatherCity').textContent = city.length > 4 ? city.slice(0, 4) : city;
                })
                .catch(setWeatherUnavailable);
        }
        getWeather();
        setInterval(getWeather, 3600000); // 每小时刷新

        // ===== 黑白切换 =====
        const toggleBtn = document.getElementById('themeToggle');
        let isLight = safeGet('theme') === 'light';

        function applyTheme() {
            if (isLight) {
                document.body.classList.add('light-mode');
                toggleBtn.textContent = '☀';
            } else {
                document.body.classList.remove('light-mode');
                toggleBtn.textContent = '✦';
            }
        }
        applyTheme();

        toggleBtn.addEventListener('click', function () {
            isLight = !isLight;
            applyTheme();
            safeSet('theme', isLight ? 'light' : 'dark');
        });

        // ===== 游戏卡片点击 =====
        const gameCard = document.getElementById('gameCard');
        const toastOverlay = document.getElementById('toastOverlay');
        const toastCloseBtn = document.getElementById('toastCloseBtn');

        function showToast() {
            if (toastOverlay.classList.contains('show')) return;
            toastOverlay.classList.add('show');
        }
        function hideToast() {
            toastOverlay.classList.remove('show');
        }

        toastCloseBtn.addEventListener('click', hideToast);
        toastOverlay.addEventListener('click', function (e) {
            if (e.target === toastOverlay) hideToast();
        });

        gameCard.addEventListener('click', function () {
            const appStoreUrl = 'https://apps.apple.com/cn/app/%E7%AC%AC%E4%BA%94%E4%BA%BA%E6%A0%BC/id1232556921';
            const googlePlayUrl = 'https://play.google.com/store/apps/details?id=com.netease.idv.googleplay';
            const iosScheme = 'identityv://';
            const androidIntent = 'intent://#Intent;package=com.netease.idv.googleplay;scheme=identityv;end';

            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);

            // 非移动端直接弹提示
            if (!isIOS && !isAndroid) {
                showToast();
                return;
            }

            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = isIOS ? iosScheme : androidIntent;
            document.body.appendChild(iframe);

            let timeoutId = null;
            let isAppOpened = false;

            function onVisibilityChange() {
                if (document.hidden) {
                    isAppOpened = true;
                    clearTimeout(timeoutId);
                    document.removeEventListener('visibilitychange', onVisibilityChange);
                    if (iframe.parentNode) document.body.removeChild(iframe);
                }
            }
            document.addEventListener('visibilitychange', onVisibilityChange);

            timeoutId = setTimeout(function () {
                document.removeEventListener('visibilitychange', onVisibilityChange);
                if (iframe.parentNode) document.body.removeChild(iframe);

                if (!isAppOpened) {
                    showToast();
                    setTimeout(function () {
                        if (isIOS) {
                            window.location.href = appStoreUrl;
                        } else if (isAndroid) {
                            window.location.href = googlePlayUrl;
                        }
                    }, 2000);
                }
            }, 2500);
        });
    </script>
</body>
</html>
